services:
  # REST API — internal only. Point a second DollarDeploy hostname at
  # 127.0.0.1:3012 if you want it public.
  api:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "bun install && bun run src/api/server.ts"
    ports:
      - "127.0.0.1:${API_PORT:-3012}:3002"
    environment:
      # Changes every deploy, so compose recreates the container and the new
      # bind-mounted source is actually loaded. See "Deploys" in README.
      - GIT_TAGS=${GIT_TAGS:-dev}
      - PORT=3002
      - REDIS_URL=${REDIS_DOCKER_URL:-redis://172.17.0.1:6379}
    restart: unless-stopped

  # MCP server — the primary service. DollarDeploy proxies the app hostname here.
  mcp:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "bun install && bun run src/mcp/http.ts"
    ports:
      - "127.0.0.1:${PORT:-3013}:3003"
    environment:
      - GIT_TAGS=${GIT_TAGS:-dev}
      - MCP_PORT=3003
      - REDIS_URL=${REDIS_DOCKER_URL:-redis://172.17.0.1:6379}
    restart: unless-stopped

  # No host port — talks to Redis only.
  scheduler:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "bun install && bun run src/jobs/scheduler.ts"
    environment:
      - GIT_TAGS=${GIT_TAGS:-dev}
      - REDIS_URL=${REDIS_DOCKER_URL:-redis://172.17.0.1:6379}
    restart: unless-stopped

volumes:
  node_modules:
